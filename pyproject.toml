[project]
name = "sevensegmentmonitor"
version = "0.1.1"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.3",
    "opencv-python-headless>=5.0.0; sys_platform == 'linux'",
    "opencv-python>=5.0.0; sys_platform == 'darwin' or sys_platform == 'win32'",
]

classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["python", "http", "monitoring", "visual analyser"]

[project.urls]
Homepage = "https://github.com/lexsysko/SevenSegmentMonitor"
Documentation = "https://github.com/lexsysko/SevenSegmentMonitor#readme"
Repository = "https://github.com/lexsysko/SevenSegmentMonitor.git"
Issues = "https://github.com/lexsysko/SevenSegmentMonitor/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/SevenSegmentMonitor"]

[project.scripts]
sevensegmentmonitor = "SevenSegmentMonitor.main:main"

[tool.hatch.build.sdist]
relative-install = true

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9"]
ignore = [
    #    "RUF012",
    #    "RUF022",
    #    "RUF100",
    #    "S112",
    #    "SIM118",
    #    "UP031",
    #    "UP032",
    #    "BLE001",
    #    "PLW1508"
]

[tool.isort]
profile = "black"
line_length = 120

[tool.flake8]
max-line-length = 120



[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { some-urgent-package = false }
